[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-eval"
version = "0.1.0"
description = "CLI tool for evaluating coding-agent harness improvements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
    "pytest-json-report>=1.5.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
]

[project.scripts]
harness-eval = "harness_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_eval"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
